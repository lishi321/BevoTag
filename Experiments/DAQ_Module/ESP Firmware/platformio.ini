; [env:esp_wroom_02]
; platform = espressif8266
; board = esp_wroom_02
; framework = esp8266-nonos-sdk

[platformio]
default_envs = esp32-c5

; ESP32-C5-WROOM-1U (dual-band 2.4 + 5 GHz WiFi 6) on a DevKitC-1 style board.
; Needs Arduino core 3.3+, which the stock PlatformIO espressif32 platform doesn't ship, so use pioarduino.
; Serial goes out UART0 through the on-board USB-UART bridge (CH343), not native USB.
[env:esp32-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; The S3 / classic ESP32 envs were dropped when the firmware moved to the C5 (5 GHz + MAC v3 CSI API);
; see git history before this change for the ESP32-S3 version.
